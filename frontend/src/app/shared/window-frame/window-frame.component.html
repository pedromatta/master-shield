<article
  class="app-window flex h-full min-h-0 w-full flex-col overflow-visible isolate rounded-lg border-2 bg-surface-panel shadow-md shadow-black/50 transition-colors"
  [class]="dragging() || resizing() ? 'border-sky-600' : 'border-slate-700'"
>
  <!-- Title bar: a bronze rule under carved chrome reads as a framed panel. -->
  <header
    class="flex shrink-0 cursor-grab items-center gap-2 border-b-2 border-sky-600 bg-gradient-to-b from-surface-raised to-surface-panel px-2 py-1 active:cursor-grabbing"
    (pointerdown)="onDragStart($event)"
    (dblclick)="toggleMaximized()"
  >
    <app-icon [name]="window().icon" [size]="14" />
    <h2 class="min-w-0 flex-1 truncate font-display text-xs font-semibold tracking-wide text-slate-100">
      {{ window().title }}
    </h2>

    <div class="flex shrink-0 items-center gap-0.5" (pointerdown)="$event.stopPropagation()">
      <button
        type="button"
        class="grid size-5 place-items-center rounded text-slate-400 transition hover:bg-slate-700 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
        [attr.aria-label]="isMinimized() ? 'Restore window' : 'Minimize window'"
        [attr.aria-pressed]="isMinimized()"
        (click)="toggleMinimized()"
      >
        <span aria-hidden="true" class="text-[12px]">▁</span>
      </button>

      <button
        type="button"
        class="grid size-5 place-items-center rounded text-slate-400 transition hover:bg-slate-700 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
        [attr.aria-label]="isMaximized() ? 'Restore window size' : 'Maximize window'"
        [attr.aria-pressed]="isMaximized()"
        (click)="toggleMaximized()"
      >
        <span aria-hidden="true" class="text-[12px]">
          @if (isMaximized()) {
            <app-icon name="lu:minimize" [size]="12" />
          } @else {
            <app-icon name="lu:maximize" [size]="12" />
          }
        </span>
      </button>

      @if (closable()) {
        <button
          type="button"
          class="grid size-5 place-items-center rounded text-slate-400 transition hover:bg-rose-900 hover:text-rose-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
          aria-label="Close window"
          (click)="close()"
        >
          <app-icon name="lu:x" [size]="12" />
        </button>
      }
    </div>
  </header>

  <!-- Content -->
  <div class="app-window min-h-0 flex-1 overflow-auto bg-surface-panel">
    <ng-content />
  </div>

  <!-- Resize handles on every edge and corner; each anchors the opposite side. -->
  @if (!isMaximized()) {
    <!-- Edges -->
    <div
      class="absolute inset-x-2 top-0 h-1 cursor-ns-resize"
      role="separator"
      aria-label="Resize window from the top"
      (pointerdown)="onResizeStart($event, { top: true })"
    ></div>
    <div
      class="absolute inset-x-2 bottom-0 h-1 cursor-ns-resize"
      role="separator"
      aria-label="Resize window from the bottom"
      (pointerdown)="onResizeStart($event, { bottom: true })"
    ></div>
    <div
      class="absolute inset-y-2 left-0 w-1 cursor-ew-resize"
      role="separator"
      aria-label="Resize window from the left"
      (pointerdown)="onResizeStart($event, { left: true })"
    ></div>
    <div
      class="absolute inset-y-2 right-0 w-1 cursor-ew-resize"
      role="separator"
      aria-label="Resize window from the right"
      (pointerdown)="onResizeStart($event, { right: true })"
    ></div>

    <!-- Corners -->
    <div
      class="absolute left-0 top-0 size-3 cursor-nwse-resize"
      role="separator"
      aria-label="Resize window from the top-left"
      (pointerdown)="onResizeStart($event, { left: true, top: true })"
    ></div>
    <div
      class="absolute right-0 top-0 size-3 cursor-nesw-resize"
      role="separator"
      aria-label="Resize window from the top-right"
      (pointerdown)="onResizeStart($event, { right: true, top: true })"
    ></div>
    <div
      class="absolute bottom-0 left-0 size-3 cursor-nesw-resize"
      role="separator"
      aria-label="Resize window from the bottom-left"
      (pointerdown)="onResizeStart($event, { left: true, bottom: true })"
    ></div>
    <div
      class="absolute bottom-0 right-0 grid size-3 cursor-nwse-resize place-items-center"
      role="separator"
      aria-label="Resize window from the bottom-right"
      (pointerdown)="onResizeStart($event, { right: true, bottom: true })"
    >
      <svg viewBox="0 0 12 12" class="size-3 text-slate-600" aria-hidden="true">
        <path d="M11 1 1 11M11 6 6 11" stroke="currentColor" stroke-width="1.4" fill="none" />
      </svg>
    </div>
  }
</article>
