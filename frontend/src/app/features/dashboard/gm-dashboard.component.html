<div class="grid h-dvh grid-rows-[2.5rem_minmax(0,1fr)_3rem] bg-slate-950 text-slate-200">
  <!-- Top bar: campaign/session management live in their own windows. -->
  <header class="flex items-center gap-2 border-b-2 border-slate-700 bg-surface-raised px-2">
    <h1 class="shrink-0 font-display text-xs font-bold uppercase tracking-[0.18em] text-sky-400">Daedala</h1>

    <button
      type="button"
      class="inline-flex shrink-0 items-center gap-1.5 rounded border border-slate-700 bg-surface-raised px-2 py-1 text-[13px] text-slate-200 transition hover:border-sky-600 hover:bg-slate-700 hover:text-sky-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      (click)="openCampaigns()"
    >
      <app-icon name="ra:tower" [size]="13" />
      <span>Campaigns</span>
      @if (gameState.activeCampaign(); as campaign) {
        <span class="text-slate-500">· {{ campaign.name }}</span>
      }
    </button>

    <button
      type="button"
      class="inline-flex shrink-0 items-center gap-1.5 rounded border border-slate-700 bg-surface-raised px-2 py-1 text-[13px] text-slate-200 transition hover:border-sky-600 hover:bg-slate-700 hover:text-sky-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 disabled:opacity-40"
      [disabled]="!gameState.activeCampaignId()"
      (click)="openSessions()"
    >
      <app-icon name="lu:calendar" [size]="13" />
      <span>Sessions</span>
      @if (gameState.activeSession(); as session) {
        <span class="text-slate-500">· {{ session.title }} #{{ session.sessionNumber }}</span>
      }
    </button>

    <button
      type="button"
      class="inline-flex shrink-0 items-center gap-1.5 rounded border border-slate-700 bg-surface-raised px-2 py-1 text-[13px] text-slate-200 transition hover:border-sky-600 hover:bg-slate-700 hover:text-sky-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      (click)="openSystems()"
    >
      <app-icon name="ra:wrench" [size]="13" />
      <span>Systems</span>
    </button>

    <button
      type="button"
      class="inline-flex shrink-0 items-center gap-1.5 rounded border border-slate-700 bg-surface-raised px-2 py-1 text-[13px] text-slate-200 transition hover:border-sky-600 hover:bg-slate-700 hover:text-sky-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      (click)="openTheme()"
    >
      <app-icon name="lu:palette" [size]="13" />
      <span>Theme</span>
    </button>

    <button
      type="button"
      class="ml-auto inline-flex shrink-0 items-center gap-1.5 rounded border border-sky-700 bg-sky-600 px-2 py-1 text-[13px] font-medium text-white transition hover:bg-sky-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
      (click)="showNewCampaign.set(true)"
    >
      <app-icon name="lu:plus" [size]="13" />
      <span>Campaign</span>
    </button>

    @if (auth.user(); as user) {
      <span class="shrink-0 text-[13px] text-slate-400" [title]="user.username">
        {{ user.displayName }}
      </span>
      <button
        type="button"
        class="inline-flex shrink-0 items-center gap-1.5 rounded border border-slate-700 bg-surface-raised px-2 py-1 text-[13px] text-slate-300 transition hover:border-rose-600 hover:text-rose-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
        (click)="logout()"
      >
        <app-icon name="lu:log-out" [size]="13" />
        <span>Sign out</span>
      </button>
    }

    @if (sessionError()) {
      <p class="truncate text-[12px] text-rose-400" role="alert">{{ sessionError() }}</p>
    }
  </header>

  <!-- Main area -->
  @if (needsSetup()) {
    <main class="col-span-1 overflow-y-auto p-6">
      <app-campaign-create (created)="onCampaignCreated()" />
    </main>
  } @else {
    <main class="grid min-h-0 grid-cols-[auto_minmax(0,1fr)] overflow-hidden">
      <app-character-sidebar />

      <div class="min-h-0 min-w-0 overflow-hidden p-1.5">
        <app-window-host class="grid h-full min-h-0 gap-1.5" />
      </div>
    </main>
  }

  <!-- Tool bar -->
  <app-tool-bar />

  @if (showNewCampaign()) {
    <div
      class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/90 p-4"
      role="dialog"
      aria-modal="true"
      aria-label="Create campaign"
    >
      <app-campaign-create
        [asDialog]="true"
        (created)="onCampaignCreated()"
        (cancelled)="showNewCampaign.set(false)"
      />
    </div>
  }
</div>
