<div class="flex h-full min-h-0 flex-col">
  <div class="flex shrink-0 items-center gap-2 border-b border-slate-700 p-2">
    <div class="min-w-0 flex-1">
      <h3 class="truncate text-xs font-semibold text-slate-100">
        @if (currentLocation(); as location) {
          {{ location.name }}
        } @else {
          No map selected
        }
      </h3>
      <code class="mt-0.5 block truncate font-mono text-[12px] text-emerald-400">
        {{ stableUrl() || '—' }}
      </code>
    </div>

    <button
      type="button"
      class="shrink-0 rounded border border-slate-700 px-2 py-1 text-[13px] text-slate-300 transition hover:border-slate-500 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 disabled:opacity-40"
      [disabled]="!stableUrl()"
      (click)="copyUrl()"
    >
      {{ copied() ? 'Copied' : 'Copy URL' }}
    </button>
    <button
      type="button"
      class="shrink-0 rounded border border-slate-700 px-2 py-1 text-[13px] text-slate-300 transition hover:border-slate-500 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      (click)="refresh()"
    >
      Refresh
    </button>
    <button
      type="button"
      class="shrink-0 rounded bg-sky-600 px-2 py-1 text-[13px] font-medium text-white transition hover:bg-sky-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
      (click)="openLocations()"
    >
      Switch map
    </button>
  </div>

  <div class="grid min-h-0 flex-1 place-items-center overflow-hidden bg-slate-950 p-2">
    @if (currentLocation()?.imageUri) {
      <img
        [src]="displayUrl()"
        [alt]="currentLocation()?.name ?? 'Battle map'"
        class="max-h-full max-w-full rounded border border-slate-700 object-contain"
      />
    } @else {
      <p class="text-center text-xs italic text-slate-500">
        Pick a location with an image to project it here. Applications pointed at the address
        above will pick the change up automatically.
      </p>
    }
  </div>
</div>
