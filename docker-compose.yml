# ---------------------------------------------------------------------------
# Master Shield — container stack.
#
# Two services on a private network:
#   api  — the ASP.NET Core API **and** its embedded PostgreSQL, both inside one
#          container. The database listens on loopback only and is never
#          published, so it is reachable solely from the API process.
#   web  — nginx serving the Angular build and reverse-proxying /api and
#          /uploads to the api service.
#
# Only the web port is exposed to the host. All credentials come from `.env`.
# ---------------------------------------------------------------------------
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: master-shield-api:latest
    restart: unless-stopped
    # No `ports:` mapping: the API is reachable only on the internal network.
    expose:
      - "5120"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Allow the browser origin served by the web container.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
      # Public URL used to build password-reset links.
      App__PublicUrl: ${APP_PUBLIC_URL:-http://localhost:8090}
      # SMTP settings for password-reset email.
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__User: ${EMAIL_USER:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-}
      Email__EnableSsl: ${EMAIL_ENABLE_SSL:-true}
    volumes:
      - api-db:/var/lib/postgresql
      - api-uploads:/app/wwwroot/uploads
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: master-shield-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:5120}
      NGINX_PORT: ${WEB_PORT:-8090}
    ports:
      - "${WEB_PORT:-8090}:${WEB_PORT:-8090}"
    networks:
      - internal

volumes:
  # PostgreSQL data directory — persists campaigns across restarts.
  api-db:
  # Uploaded portraits, maps, icons and attachments.
  api-uploads:

networks:
  internal:
    driver: bridge
