<section class="space-y-4 p-3" aria-label="Theme settings">
  <header class="flex items-center gap-2">
    <app-icon name="lu:palette" [size]="16" />
    <h2 class="mr-auto text-sm font-semibold text-slate-100">Personal theme</h2>
    @if (hasOverrides()) {
      <button
        type="button"
        class="rounded border border-slate-700 px-2 py-1 text-[12px] text-slate-300 transition hover:border-slate-500 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 disabled:opacity-40"
        [disabled]="busy()"
        (click)="reset()"
      >
        Reset
      </button>
    }
  </header>

  @if (status()) {
    <p class="rounded border border-slate-700 bg-surface-panel px-2 py-1 text-[12px] text-slate-300" role="status">
      {{ status() }}
    </p>
  }

  <!-- Colours -->
  <div class="rounded border border-slate-700 bg-surface-panel p-2">
    <h3 class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Colours</h3>
    <div class="grid grid-cols-3 gap-2">
      <label class="flex flex-col gap-1 text-[12px] text-slate-300">
        Accent
        <input
          type="color"
          class="h-8 w-full cursor-pointer rounded border border-slate-700 bg-slate-950"
          [value]="accent()"
          (input)="setColor('accent', $any($event.target).value)"
        />
      </label>
      <label class="flex flex-col gap-1 text-[12px] text-slate-300">
        Danger
        <input
          type="color"
          class="h-8 w-full cursor-pointer rounded border border-slate-700 bg-slate-950"
          [value]="danger()"
          (input)="setColor('danger', $any($event.target).value)"
        />
      </label>
      <label class="flex flex-col gap-1 text-[12px] text-slate-300">
        Success
        <input
          type="color"
          class="h-8 w-full cursor-pointer rounded border border-slate-700 bg-slate-950"
          [value]="success()"
          (input)="setColor('success', $any($event.target).value)"
        />
      </label>
    </div>
  </div>

  <!-- Fonts -->
  <div class="rounded border border-slate-700 bg-surface-panel p-2">
    <h3 class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Fonts</h3>
    <div class="grid gap-2 sm:grid-cols-2">
      <label class="flex flex-col gap-1 text-[12px] text-slate-300">
        Body
        <select
          class="rounded border border-slate-700 bg-slate-950 px-2 py-1 text-[13px] text-slate-200 focus:border-sky-500 focus:outline-none"
          [value]="fontBody()"
          (change)="setFont('fontBody', $any($event.target).value)"
        >
          @for (font of fonts; track font.value) {
            <option [value]="font.value">{{ font.label }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-[12px] text-slate-300">
        Headings
        <select
          class="rounded border border-slate-700 bg-slate-950 px-2 py-1 text-[13px] text-slate-200 focus:border-sky-500 focus:outline-none"
          [value]="fontDisplay()"
          (change)="setFont('fontDisplay', $any($event.target).value)"
        >
          @for (font of displayFonts; track font.value) {
            <option [value]="font.value">{{ font.label }}</option>
          }
        </select>
      </label>
    </div>
  </div>

  <!-- Background -->
  <div class="rounded border border-slate-700 bg-surface-panel p-2">
    <h3 class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Background</h3>
    @if (theme.settings().backgroundUri) {
      <img
        [src]="theme.settings().backgroundUri"
        alt="Current background"
        class="mb-2 h-24 w-full rounded border border-slate-700 object-cover"
        loading="lazy"
      />
    }
    <div class="flex flex-wrap items-center gap-2">
      <label class="cursor-pointer rounded border border-slate-700 px-2 py-1 text-[12px] text-slate-300 transition hover:border-sky-600 hover:text-sky-300 focus-within:ring-2 focus-within:ring-sky-500">
        Upload image
        <input
          type="file"
          accept="image/*"
          class="sr-only"
          [disabled]="busy()"
          (change)="onBackgroundChosen($any($event.target).files); $any($event.target).value = ''"
        />
      </label>
      @if (theme.settings().backgroundUri) {
        <button
          type="button"
          class="rounded border border-slate-700 px-2 py-1 text-[12px] text-rose-400 transition hover:border-rose-600 hover:text-rose-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 disabled:opacity-40"
          [disabled]="busy()"
          (click)="clearBackground()"
        >
          Remove
        </button>
      }
    </div>
  </div>
</section>
