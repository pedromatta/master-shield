<div class="mt-1.5 rounded border border-slate-800 bg-slate-950/70 p-2">
  <div class="mb-1 flex items-center justify-between">
    <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Effects</span>
    <span class="text-[10px] text-slate-600">{{ entries().length }} active</span>
  </div>

  @if (hasEntries()) {
    <ul class="mb-1.5 flex flex-wrap gap-1">
      @for (entry of entries(); track trackKey($index, entry)) {
        <li>
          <button
            type="button"
            class="group inline-flex items-center gap-1 rounded-full border border-amber-700/60 bg-amber-950/60 px-2 py-0.5 text-[10px] text-amber-200 transition hover:border-rose-500 hover:text-rose-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
            [attr.aria-label]="'Remove effect ' + entry.key"
            (click)="remove(entry.key)"
          >
            <span class="font-medium">{{ entry.key }}</span>
            @if (entry.value !== true) {
              <span class="text-amber-400/90">{{ display(entry.value) }}</span>
            }
            <app-icon name="lu:x" [size]="11" />
          </button>
        </li>
      }
    </ul>
  }

  <div class="flex items-center gap-1">
    <label class="sr-only" [attr.for]="'effect-key-' + participantId()">Effect name</label>
    <input
      [id]="'effect-key-' + participantId()"
      type="text"
      placeholder="poisoned"
      class="min-w-0 flex-1 rounded border border-slate-700 bg-slate-900 px-1.5 py-0.5 text-[11px] text-slate-200 placeholder:text-slate-600 focus:border-sky-500 focus:outline-none"
      [value]="draftKey()"
      (input)="draftKey.set($any($event.target).value)"
      (keydown.enter)="inject()"
    />
    <label class="sr-only" [attr.for]="'effect-value-' + participantId()"
      >Effect value (optional)</label
    >
    <input
      [id]="'effect-value-' + participantId()"
      type="text"
      placeholder="value"
      class="w-16 rounded border border-slate-700 bg-slate-900 px-1.5 py-0.5 text-[11px] text-slate-200 placeholder:text-slate-600 focus:border-sky-500 focus:outline-none"
      [value]="draftValue()"
      (input)="draftValue.set($any($event.target).value)"
      (keydown.enter)="inject()"
    />
    <button
      type="button"
      class="shrink-0 rounded bg-amber-700 px-2 py-0.5 text-[11px] font-medium text-white transition hover:bg-amber-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 disabled:opacity-40"
      [disabled]="!draftKey().trim()"
      (click)="inject()"
    >
      Inject
    </button>
  </div>
</div>
