<div class="grid h-dvh grid-rows-[2.5rem_minmax(0,1fr)_3rem] bg-slate-950 text-slate-200">
  <!-- Top bar: campaign/session management live in their own windows. -->
  <header class="flex items-center gap-2 border-b border-slate-800 bg-slate-900/80 px-2">
    <h1 class="shrink-0 text-xs font-bold uppercase tracking-[0.2em] text-sky-400">Master Shield</h1>

    <button
      type="button"
      class="shrink-0 rounded border border-slate-700 px-2 py-1 text-[11px] text-slate-300 transition hover:border-sky-600 hover:text-sky-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      (click)="openCampaigns()"
    >
      <app-icon name="ra:tower" [size]="14" /> Campaigns
      @if (gameState.activeCampaign(); as campaign) {
        <span class="ml-1 text-slate-500">· {{ campaign.name }}</span>
      }
    </button>

    <button
      type="button"
      class="shrink-0 rounded border border-slate-700 px-2 py-1 text-[11px] text-slate-300 transition hover:border-sky-600 hover:text-sky-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 disabled:opacity-40"
      [disabled]="!gameState.activeCampaignId()"
      (click)="openSessions()"
    >
      <app-icon name="lu:calendar" [size]="14" /> Sessions
      @if (gameState.activeSession(); as session) {
        <span class="ml-1 text-slate-500">· #{{ session.sessionNumber }} {{ session.title }}</span>
      }
    </button>

    <button
      type="button"
      class="shrink-0 rounded border border-slate-700 px-2 py-1 text-[11px] text-slate-300 transition hover:border-slate-500 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      (click)="openSystems()"
    >
        <app-icon name="ra:wrench" [size]="14" /> Systems
    </button>

    @if (gameState.activeSessionId()) {
      <button
        type="button"
        class="shrink-0 rounded border border-slate-700 px-2 py-1 text-[11px] text-amber-400 transition hover:border-amber-600 hover:text-amber-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
        (click)="createEncounter()"
      >
        + Encounter
      </button>
    }

    <button
      type="button"
      class="ml-auto shrink-0 rounded bg-sky-600 px-2 py-1 text-[11px] font-medium text-white transition hover:bg-sky-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
      (click)="showNewCampaign.set(true)"
    >
      + Campaign
    </button>

    @if (sessionError()) {
      <p class="truncate text-[10px] text-rose-400" role="alert">{{ sessionError() }}</p>
    }
  </header>

  <!-- Main area -->
  @if (needsSetup()) {
    <main class="col-span-1 overflow-y-auto p-6">
      <app-campaign-create (created)="onCampaignCreated()" />
    </main>
  } @else {
    <main class="grid min-h-0 grid-cols-[auto_minmax(0,1fr)] overflow-hidden">
      <app-character-sidebar />

      <div class="min-h-0 min-w-0 overflow-hidden p-1.5">
        <app-window-host class="grid h-full min-h-0 gap-1.5" />
      </div>
    </main>
  }

  <!-- Tool bar -->
  <app-tool-bar />

  @if (showNewCampaign()) {
    <div
      class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm"
      role="dialog"
      aria-modal="true"
      aria-label="Create campaign"
    >
      <app-campaign-create
        [asDialog]="true"
        (created)="onCampaignCreated()"
        (cancelled)="showNewCampaign.set(false)"
      />
    </div>
  }
</div>
