<div class="relative">
  <span class="mb-0.5 block text-[10px] uppercase tracking-wider text-slate-500">{{ label() }}</span>

  <div class="flex items-center gap-1.5">
    <button
      type="button"
      class="flex size-10 items-center justify-center overflow-hidden rounded border border-slate-700 bg-slate-950 text-slate-200 transition hover:border-sky-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="label() + ' — choose an icon'"
      (click)="toggle()"
    >
      @if (imageUri()) {
        <img [src]="imageUri()" alt="" class="size-full object-cover" loading="lazy" />
      } @else {
        <app-icon [name]="value()" [size]="20" />
      }
    </button>

    <div class="flex flex-col gap-0.5">
      <button
        type="button"
        class="rounded border border-slate-700 px-1.5 py-0.5 text-[10px] text-slate-300 transition hover:border-sky-600 hover:text-sky-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
        (click)="toggle()"
      >
        Pick
      </button>
      @if (value() || imageUri()) {
        <button
          type="button"
          class="rounded border border-slate-700 px-1.5 py-0.5 text-[10px] text-slate-500 transition hover:border-rose-700 hover:text-rose-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
          (click)="clear()"
        >
          Clear
        </button>
      }
    </div>
  </div>

  @if (open()) {
    <div
      class="absolute z-30 mt-1 w-72 rounded-lg border border-slate-700 bg-surface-panel p-2 shadow-2xl shadow-black/50"
      role="dialog"
      aria-label="Choose an icon"
    >
      <div class="mb-2 flex items-center gap-1.5">
        <label class="sr-only" for="icon-search">Search icons</label>
        <input
          id="icon-search"
          type="search"
          placeholder="Search icons…"
          class="min-w-0 flex-1 rounded border border-slate-700 bg-slate-950 px-2 py-1 text-[11px] text-slate-200 placeholder:text-slate-600 focus:border-sky-500 focus:outline-none"
          [value]="search()"
          (input)="search.set($any($event.target).value)"
        />
        <span class="shrink-0 text-[9px] text-slate-500">{{ resultCount() }}</span>
      </div>

      <!-- Image upload option -->
      <label
        class="mb-2 flex cursor-pointer items-center gap-2 rounded border border-dashed border-slate-700 px-2 py-1.5 text-[11px] text-slate-400 transition hover:border-sky-600 hover:text-sky-300"
      >
        <app-icon name="lu:upload" [size]="14" />
        Upload an image instead
        <input
          type="file"
          accept="image/*"
          class="sr-only"
          (change)="onImageChosen($any($event.target).files[0]); $any($event.target).value = ''"
        />
      </label>

      <div class="max-h-64 overflow-y-auto pr-1">
        @if (resultCount() === 0) {
          <p class="py-3 text-center text-[11px] italic text-slate-500">No icons match.</p>
        } @else {
          @for (group of groups(); track group.name) {
            <div class="mb-2">
              <p class="mb-1 text-[9px] font-semibold uppercase tracking-wider text-slate-500">
                {{ group.name }}
              </p>
              <ul class="grid grid-cols-8 gap-0.5">
                @for (icon of group.icons; track icon.id) {
                  <li>
                    <button
                      type="button"
                      class="grid size-7 place-items-center rounded text-slate-300 transition hover:bg-slate-700 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
                      [class]="value() === icon.id ? 'bg-sky-900 text-sky-200' : ''"
                      [attr.aria-label]="icon.label"
                      [title]="icon.label"
                      (click)="choose(icon)"
                    >
                      <app-icon [name]="icon.id" [size]="14" />
                    </button>
                  </li>
                }
              </ul>
            </div>
          }
        }
      </div>

      <div class="mt-1 flex justify-end">
        <button
          type="button"
          class="rounded border border-slate-700 px-2 py-0.5 text-[10px] text-slate-400 transition hover:border-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
          (click)="open.set(false)"
        >
          Close
        </button>
      </div>
    </div>
  }
</div>
