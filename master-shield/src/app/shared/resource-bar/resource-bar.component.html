@let r = resource();

<div class="group/resource" [title]="r.nome + ': ' + r.currentValue + ' / ' + r.maxValue">
  <div class="flex items-center gap-1">
    <span class="min-w-0 flex-1 truncate text-[10px] text-slate-400">{{ r.nome }}</span>

    @if (editable()) {
      <button
        type="button"
        class="grid size-4 shrink-0 place-items-center rounded border border-slate-700 text-[9px] leading-none text-rose-400 opacity-0 transition hover:border-rose-500 hover:bg-rose-950 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 group-hover/resource:opacity-100 focus-visible:opacity-100 disabled:opacity-30"
        [disabled]="isEmpty()"
        [attr.aria-label]="'Decrease ' + r.nome"
        (click)="adjust(-1, $event)"
      >
        −
      </button>
      <button
        type="button"
        class="grid size-4 shrink-0 place-items-center rounded border border-slate-700 text-[9px] leading-none text-emerald-400 opacity-0 transition hover:border-emerald-500 hover:bg-emerald-950 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 group-hover/resource:opacity-100 focus-visible:opacity-100 disabled:opacity-30"
        [disabled]="isFull()"
        [attr.aria-label]="'Increase ' + r.nome"
        (click)="adjust(1, $event)"
      >
        +
      </button>
    }

    <span class="shrink-0 font-mono text-[10px] tabular-nums" [class]="isLow() ? 'text-rose-400' : 'text-slate-300'">
      {{ r.currentValue }}/{{ r.maxValue }}
    </span>
  </div>

  <div
    class="mt-0.5 h-1.5 w-full overflow-hidden rounded-full bg-slate-800"
    role="progressbar"
    [attr.aria-valuenow]="r.currentValue"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="r.maxValue"
    [attr.aria-label]="r.nome + ' bar'"
  >
    <div
      class="h-full rounded-full transition-[width] duration-150"
      [style.width.%]="percent()"
      [style.background-color]="isLow() ? '#f43f5e' : r.colorHwx"
    ></div>
  </div>

  @if (expressionInput() && editable()) {
    <label class="sr-only" [attr.for]="'expr-' + r.id">Adjust {{ r.nome }}</label>
    <input
      [id]="'expr-' + r.id"
      type="text"
      inputmode="numeric"
      [placeholder]="'+5  −5  5'"
      class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-1.5 py-0.5 font-mono text-[10px] text-slate-200 placeholder:text-slate-600 focus:border-sky-500 focus:outline-none"
      [ngModel]="expression()"
      (ngModelChange)="expression.set($event)"
      (keydown.enter)="applyExpression($event)"
      (blur)="applyExpression($event)"
    />
  }
</div>
