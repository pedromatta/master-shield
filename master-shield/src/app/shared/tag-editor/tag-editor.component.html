<div class="space-y-1.5">
  <div class="flex items-center justify-between">
    <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">{{ label() }}</span>
    <button
      type="button"
      class="text-[10px] text-sky-400 transition hover:text-sky-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      [attr.aria-expanded]="!compact()"
      (click)="creating.set(!creating())"
    >
      + Tag
    </button>
  </div>

  @if (allTags().length > 0) {
    <ul class="flex flex-wrap gap-1">
      @for (tag of allTags(); track tag.id) {
        <li
          class="inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[10px]"
          [class]="isSelected(tag) ? 'bg-slate-800 font-medium' : 'border-slate-700'"
          [style]="isSelected(tag) ? chipStyle(tag) : ''"
        >
          <button
            type="button"
            class="transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
            [class]="isSelected(tag) ? '' : 'text-slate-500'"
            [attr.aria-pressed]="isSelected(tag)"
            [attr.aria-label]="(isSelected(tag) ? 'Remove tag ' : 'Add tag ') + tag.name"
            (click)="toggle(tag)"
          >
            {{ tag.name }}
          </button>

          @if (isSelected(tag)) {
            <button
              type="button"
              class="text-slate-500 transition hover:text-rose-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
              [attr.aria-label]="'Delete tag ' + tag.name + ' everywhere'"
              (click)="deleteTag(tag, $event)"
            >
              <app-icon name="lu:x" [size]="11" />
            </button>
          }
        </li>
      }
    </ul>
  } @else {
    <p class="text-[10px] italic text-slate-600">No tags yet.</p>
  }

  @if (creating()) {
    <div class="flex items-center gap-1">
      <label class="sr-only" [attr.for]="inputId">New tag name</label>
      <input
        [id]="inputId"
        type="text"
        placeholder="tag name"
        class="min-w-0 flex-1 rounded border border-slate-700 bg-slate-950 px-1.5 py-0.5 text-[11px] text-slate-200 placeholder:text-slate-600 focus:border-sky-500 focus:outline-none"
        [value]="draftName()"
        (input)="draftName.set($any($event.target).value)"
        (keydown.enter)="createTag()"
      />
      <label class="sr-only" [attr.for]="colorId">Tag colour</label>
      <input
        [id]="colorId"
        type="color"
        class="h-6 w-8 cursor-pointer rounded border border-slate-700 bg-slate-950"
        [value]="draftColor()"
        (input)="draftColor.set($any($event.target).value)"
      />
      <button
        type="button"
        class="rounded bg-sky-600 px-2 py-0.5 text-[11px] font-medium text-white transition hover:bg-sky-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 disabled:opacity-40"
        [disabled]="!draftName().trim() || saving()"
        (click)="createTag()"
      >
        Add
      </button>
    </div>
  }

  @if (error()) {
    <p class="text-[10px] text-rose-400" role="alert">{{ error() }}</p>
  }
</div>
