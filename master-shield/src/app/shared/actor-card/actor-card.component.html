@let a = actor();

<div class="group/card relative">
  <button
    type="button"
    class="flex w-full flex-col items-center gap-1 rounded-lg border border-slate-700 bg-surface-panel p-2 text-center transition hover:border-sky-600 hover:bg-surface-raised focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
    [attr.aria-label]="'Open ' + a.name + ' sheet'"
    (click)="opened.emit()"
  >
    @if (portraitUri()) {
      <img
        [src]="portraitUri()"
        [alt]="''"
        class="size-14 rounded-full border border-slate-700 object-cover"
        loading="lazy"
        (error)="$any($event.target).style.display = 'none'"
      />
    } @else {
      <span
        class="grid size-14 place-items-center rounded-full border border-slate-700 bg-slate-950 text-slate-400"
        aria-hidden="true"
      >
        <app-icon [name]="actor().iconId ?? ''" [size]="24" />
      </span>
    }

    <span class="line-clamp-2 w-full text-[11px] font-medium leading-tight text-slate-100">
      {{ a.name }}
    </span>
    <span class="text-[9px] uppercase tracking-wide text-slate-500">{{ typeLabel() }}</span>

    @if (topTags().length > 0) {
      <span class="flex flex-wrap justify-center gap-0.5">
        @for (tag of topTags(); track tag.id) {
          <span
            class="rounded-full border px-1 text-[8px] leading-tight"
            [style]="tagStyle(tag)"
          >
            {{ tag.name }}
          </span>
        }
      </span>
    }
  </button>

  @if (showAddToEncounter()) {
    <button
      type="button"
      class="absolute right-1 top-1 grid size-5 place-items-center rounded border border-slate-700 bg-slate-950/90 text-[10px] opacity-0 transition hover:border-amber-500 hover:text-amber-400 focus:outline-none focus-visible:opacity-100 focus-visible:ring-2 focus-visible:ring-sky-500 group-hover/card:opacity-100"
      [attr.aria-label]="'Add ' + a.name + ' to the encounter'"
      (click)="onAdd($event)"
    >
      <app-icon name="ra:crossed-swords" [size]="12" />
    </button>
  }
</div>
