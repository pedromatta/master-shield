<section class="rounded border border-slate-700 bg-slate-950 p-2" aria-label="Linked rules">
  <div class="mb-1.5 flex items-center gap-1.5">
    <button
      type="button"
      class="flex min-w-0 flex-1 items-center gap-1.5 text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      [attr.aria-expanded]="open()"
      (click)="open.set(!open())"
    >
      <app-icon name="lu:book-open" [size]="13" />
      <span class="text-[12px] font-semibold uppercase tracking-wider text-slate-400">
        {{ label() }}
      </span>
      <span class="text-[11px] text-slate-500">({{ countLabel() }})</span>
    </button>
  </div>

  @if (open()) {
    @if (groups().length === 0) {
      <p class="text-[12px] italic text-slate-600">
        No rules in this campaign yet. Create rules first, then link them here.
      </p>
    } @else {
      <label class="sr-only" for="rule-picker-search">Search rules</label>
      <input
        id="rule-picker-search"
        type="search"
        placeholder="Search rules…"
        class="mb-1.5 w-full rounded border border-slate-700 bg-slate-950 px-2 py-0.5 text-[13px] text-slate-200 placeholder:text-slate-600 focus:border-sky-500 focus:outline-none"
        [value]="search()"
        (input)="search.set($any($event.target).value)"
      />

      <div class="max-h-48 space-y-1.5 overflow-y-auto">
        @for (group of groups(); track group.id) {
          <div>
            <p class="mb-0.5 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
              {{ group.name }}
            </p>
            <ul class="space-y-0.5">
              @for (rule of group.rules; track rule.id) {
                <li>
                  <button
                    type="button"
                    class="flex w-full items-center gap-1.5 rounded px-1.5 py-0.5 text-left text-[13px] transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
                    [class]="isSelected(rule.id) ? 'bg-surface-raised text-sky-300' : 'text-slate-400 hover:bg-surface-panel'"
                    [attr.aria-pressed]="isSelected(rule.id)"
                    (click)="toggle(rule.id)"
                  >
                    @if (isSelected(rule.id)) {
                      <app-icon name="lu:check" [size]="12" />
                    } @else if (rule.imageUri) {
                      <img [src]="resolveAsset(rule.imageUri)" alt="" class="size-3.5 rounded-sm object-cover" loading="lazy" />
                    } @else {
                      <app-icon [name]="rule.iconId ?? 'ra:scroll-unfurled'" [size]="12" />
                    }
                    <span class="min-w-0 flex-1 truncate">{{ rule.title || 'Untitled' }}</span>
                  </button>
                </li>
              }
            </ul>
          </div>
        }
      </div>
    }
  }
</section>
